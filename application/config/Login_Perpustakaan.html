<!DOCTYPE html>
<html lang ="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>sistem login perpustakaan</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
	body {
		background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.login-card {
		border: none;
		border-radius: 1rem;
		box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
		overflow: hidden;
	}
	.brand-section {
		background-color: #162d59;
		color: #ffffff;
	}
</style>
</head>
<body>
	<div class="container">
	<div class="row justify-content-center">
	<div class="col-md-8 col-lg-5">
	<div class="card login-card">
	<div class="brand-section text-center p-4">
	<i class="bi bi-book-half fs-1 text-warning"></i>
	<h4 class="mt-2 mb-0 fw-bold">ARIES DIGITAL</h4>
	<small class="text-light opacity-75">Sistem Informasi & Manajemen Perpustakaan</small>
</div>

<div class="card-body p-4 p-md-5 bg-white">
	<h5 class="fw-bold text-dark mb-1">Selamat Datang </h5>
	<p class="text-muted small mb-4">Silahkan Login menggunakan akun petugas atau anggota</p>
</div>

<div id="alertError" class="alert alert-danger d-none align-items-center py-2" role="alert">
	<i class="bi bi-exclamation-triangle-fill me-2"></i>
	<div id="errorText" class="small">Username atau password salah!</div>
</div>

<form id="loginForm" novalidate>
	<div class="mb-3">
		<label for="username" class="form-label fw-semibold small">Username / ID Anggota</label>
		<div class="input-group">
			<span class="input-group-text bg-light"><i class="bi bi-person"></i></span>	
			<input type="text" class="form-control" id="username" name="username" placeholder="Masukan username" required>	
		</div>
	</div>

	<div class="mb-3">
		<label for="password" class="form-label fw-semibold small">Password</label>
		<div class="input-group">
			<span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
			<input type="password" class="form-control" id="password" name="password" placeholder="Masukan Password" required>
			<button class="btn btn-outline-secondary" type="button" id="togglePassword">
				<i class="bi bi-eye" id="eyeIcon"></i></button>
		</div>
	</div>

	<div class="d-grid">
		<button class="btn btn-primary" type="submit">Login</button>
	</div>
</form>
</div>
	</div>

<script>
    if (sessionStorage.getItem('aries_user')) {
      window.location.href = 'dashboard.html';
    }

    const users = [
      { username: 'admin', password: 'admin0509', nama: 'Administrator Perpustakaan', role: 'Kepala Pustakawan' },
      { username: 'pustakawan', password: 'perpus2026', nama: 'Siti Hidayah, S.I.Pust', role: 'Staf Sirkulasi' }
    ];

    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
	togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
	  const usernameVal = document.getElementById('username').value.trim();
      const passwordVal = document.getElementById('password').value.trim();
      const alertError = document.getElementById('alertError');
      const errorText = document.getElementById('errorText');

      if (!usernameVal || !passwordVal) {
        errorText.textContent = 'Username dan password wajib diisi!';
        alertError.classList.remove('d-none');
        alertError.classList.add('d-flex');
        return;
      }

      const validUser = users.find(u => u.username === usernameVal && u.password === passwordVal);

      if (validUser) {
        // Simpan data sesi login
        sessionStorage.setItem('aries_user', JSON.stringify(validUser));
        window.location.href = 'dashboard.html';
      } else {
        errorText.textContent = 'Username atau password tidak sesuai!';
        alertError.classList.remove('d-none');
        alertError.classList.add('d-flex');
      }
    });
  </script>
</body>
</html>
