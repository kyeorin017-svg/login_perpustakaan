<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Online Bootstrap</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">TokoKu</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Beranda</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Produk</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Kontak</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Hero Section -->
<section class="bg-light text-center p-5">
  <h1>Selamat Datang di TokoKu</h1>
  <p class="lead">Belanja mudah dengan Bootstrap</p>
  <a href="#produk" class="btn btn-primary">Lihat Produk</a>
</section>

<!-- Produk -->
<section id="produk" class="container my-5">
  <h2 class="text-center mb-4">Produk Kami</h2>
  <div class="row">
    <!-- Card Produk 1 -->
    <div class="col-md-4">
      <div class="card">
        <img src="img/produk1.jpg" class="card-img-top" alt="Produk 1">
        <div class="card-body">
          <h5 class="card-title">Produk 1</h5>
          <p class="card-text">Deskripsi singkat produk.</p>
          <a href="#" class="btn btn-success">Beli</a>
        </div>
      </div>
    </div>
    <!-- Card Produk 2 -->
    <div class="col-md-4">
      <div class="card">
        <img src="img/produk2.jpg" class="card-img-top" alt="Produk 2">
        <div class="card-body">
          <h5 class="card-title">Produk 2</h5>
          <p class="card-text">Deskripsi singkat produk.</p>
          <a href="#" class="btn btn-success">Beli</a>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">
  <p>&copy; 2026 TokoKu. All rights reserved.</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
